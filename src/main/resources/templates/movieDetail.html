<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
                xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="${movie != null} ? ${movie.title} + ' — CINÉast' : 'CINÉast'">Movie — CINÉast</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/cineast.css">
<style>
/* Full-height immersive backdrop */
.detail-scene {
  position: relative; min-height: 100vh;
}
.detail-backdrop {
  position: fixed; inset: 0; z-index: 0;
  background-size: cover; background-position: center 20%;
  transition: opacity 1.2s ease;
  will-change: transform;
}
.detail-backdrop-overlay {
  position: fixed; inset: 0; z-index: 1;
  background:
    linear-gradient(to bottom,
      rgba(13,14,18,0.2)  0%,
      rgba(13,14,18,0.6) 30%,
      rgba(13,14,18,0.92) 60%,
      #0D0E12            100%),
    linear-gradient(to right,
      rgba(13,14,18,0.5) 0%,
      transparent        60%);
}

/* Content sits above fixed bg */
.detail-content {
  position: relative; z-index: 2;
  padding-top: 120px;
}

.detail-inner {
  max-width: 1100px; margin: 0 auto; padding: 0 52px 40px;
  display: flex; gap: 48px; align-items: flex-start;
}

/* Poster — floats out of the page */
.poster-col {
  flex: 0 0 240px;
  position: sticky; top: 90px;
  opacity: 0; transform: translateX(-24px);
  animation: slideIn .7s .2s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes slideIn { to { opacity:1; transform:translateX(0); } }

.poster-col img {
  width: 100%; border-radius: 16px;
  box-shadow: 0 32px 80px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.06);
  display: block;
}

/* Info column */
.info-col {
  flex: 1;
  opacity: 0; transform: translateY(24px);
  animation: fadeUp .7s .35s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes fadeUp { to { opacity:1; transform:translateY(0); } }

.movie-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(36px,5vw,64px);
  letter-spacing: 2px; line-height: .95;
  margin-bottom: 18px;
  text-shadow: 0 2px 24px rgba(0,0,0,.6);
}
.meta-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:28px; }
.rating-badge {
  display:flex; align-items:center; gap:6px;
  background:rgba(229,169,60,.15); border:1px solid rgba(229,169,60,.4);
  border-radius:20px; padding:6px 16px;
  color:var(--gold); font-weight:700; font-size:15px;
}
.meta-pill {
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.1);
  border-radius:20px; padding:4px 13px; font-size:12px; color:var(--muted);
}
.ov-label {
  font-size:11px; letter-spacing:2px; font-weight:600;
  color:var(--gold); text-transform:uppercase; margin-bottom:10px;
}
.overview {
  color:rgba(200,206,218,.85); line-height:1.85; font-size:15px;
  max-width:620px; margin-bottom:36px; font-weight:300;
}
.info-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
  gap:14px; margin-bottom:36px;
}
.info-item {
  background:rgba(25,28,36,0.6); backdrop-filter:blur(16px);
  border-radius:12px; padding:16px 18px;
  border:1px solid rgba(255,255,255,.07);
  transition: border-color .2s, transform .2s;
}
.info-item:hover { border-color:rgba(229,169,60,.25); transform:translateY(-2px); }
.info-item .lbl { font-size:10px; color:var(--gold); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:5px; font-weight:600; }
.info-item .val { font-size:14px; font-weight:500; }

/* Reviews */
.reviews-section {
  max-width:1100px; margin:0 auto; padding:0 52px 100px;
  position:relative; z-index:2;
}
.reviews-divider {
  height:1px;
  background:linear-gradient(to right, rgba(229,169,60,.4), rgba(229,169,60,.1), transparent);
  margin-bottom:36px;
}
.reviews-title {
  font-family:'Bebas Neue',sans-serif;
  font-size:28px; letter-spacing:2px; margin-bottom:12px;
}
.review-form {
  background:rgba(20,23,32,0.7); backdrop-filter:blur(20px);
  border-radius:16px; padding:28px;
  border:1px solid rgba(255,255,255,.08); margin-bottom:36px;
}
.review-form h3 { font-size:15px; font-weight:600; margin-bottom:16px; color:var(--muted); }
.review-form textarea {
  width:100%; min-height:100px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:10px; color:var(--text);
  padding:14px 16px; font-size:14px; resize:vertical;
  outline:none; font-family:'Inter',sans-serif;
  transition:border-color .2s; line-height:1.65;
}
.review-form textarea:focus { border-color:var(--gold); }
.btn-submit {
  margin-top:12px; padding:11px 28px;
  background:linear-gradient(135deg,#E5A93C,#c8891a);
  color:#0D0E12; border:none; border-radius:10px;
  font-weight:700; font-size:14px; cursor:pointer;
  font-family:'Inter',sans-serif; transition:opacity .2s,transform .15s;
}
.btn-submit:hover { opacity:.9; transform:translateY(-1px); }
.review-list { display:flex; flex-direction:column; gap:14px; }
.review-card {
  background:rgba(20,23,32,0.65); backdrop-filter:blur(16px);
  border-radius:14px; padding:22px 24px;
  border:1px solid rgba(255,255,255,.07);
  transition:border-color .2s, transform .2s;
}
.review-card:hover { border-color:rgba(229,169,60,.2); transform:translateY(-2px); }
.rc-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.rc-av {
  width:36px; height:36px; border-radius:50%;
  background:rgba(229,169,60,.15); border:1px solid rgba(229,169,60,.3);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:13px; color:var(--gold); flex-shrink:0;
}
.rc-author { font-weight:600; font-size:14px; }
.rc-date { font-size:12px; color:var(--muted); }
.rc-content { color:rgba(180,186,198,.85); font-size:14px; line-height:1.75; font-weight:300; }
.no-reviews {
  color:var(--muted); font-size:14px; text-align:center; padding:40px;
  background:rgba(20,23,32,.5); border-radius:14px;
  border:1px solid rgba(255,255,255,.06);
}
.signin-prompt { color:var(--muted); font-size:14px; margin-bottom:24px; }
.signin-prompt a { color:var(--gold); }
</style>
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<div th:if="${movie != null}" class="detail-scene">
  <!-- Fixed cinematic backdrop -->
  <div class="detail-backdrop" id="detailBg"
       th:if="${movie.hasBackdrop()}"
       th:style="'background-image:url(' + ${movie.backdropUrl} + ')'">
  </div>
  <div class="detail-backdrop-overlay"></div>

  <div class="detail-content">
    <div class="detail-inner">
      <!-- Poster -->
      <div class="poster-col" th:if="${movie.hasPoster()}">
        <img th:src="${movie.posterUrl}" th:alt="${movie.title}">
      </div>

      <!-- Info -->
      <div class="info-col">
        <h1 class="movie-title" th:text="${movie.title}"></h1>
        <div class="meta-row">
          <span class="rating-badge">
            ★ <span th:text="${movie.ratingFormatted}"></span>
          </span>
          <span class="meta-pill" th:text="${movie.releaseYear}"></span>
          <span class="meta-pill" th:if="${movie.runtime > 0}"
                th:text="${movie.runtime} + ' min'"></span>
        </div>
        <div class="ov-label">Overview</div>
        <p class="overview" th:text="${movie.overview}"></p>
        <div class="info-grid">
          <div class="info-item">
            <div class="lbl">Release date</div>
            <div class="val" th:text="${movie.releaseDate}"></div>
          </div>
          <div class="info-item">
            <div class="lbl">Rating</div>
            <div class="val">⭐ <span th:text="${movie.ratingFormatted}"></span> / 10</div>
          </div>
          <div class="info-item">
            <div class="lbl">Popularity</div>
            <div class="val" th:text="${#numbers.formatDecimal(movie.popularity,0,0)} + ' pts'"></div>
          </div>
          <div class="info-item" th:if="${movie.runtime > 0}">
            <div class="lbl">Runtime</div>
            <div class="val" th:text="${movie.runtime} + ' min'"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Reviews -->
    <div class="reviews-section">
      <h2 class="reviews-title">Reviews</h2>
      <div class="reviews-divider"></div>

      <!-- Write review (authenticated) -->
      <div sec:authorize="isAuthenticated()" class="review-form">
        <h3>Write your review</h3>
        <form th:action="@{/movie/{id}/review(id=${movie.id})}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <textarea name="content" placeholder="Share your thoughts about this film…" required></textarea>
          <button type="submit" class="btn-submit">Post review</button>
        </form>
      </div>

      <p sec:authorize="!isAuthenticated()" class="signin-prompt">
        <a href="/login">Sign in</a> to write a review.
      </p>

      <!-- Review list -->
      <div th:if="${#lists.isEmpty(reviews)}" class="no-reviews">
        No reviews yet. Be the first to share your thoughts!
      </div>
      <div th:unless="${#lists.isEmpty(reviews)}" class="review-list">
        <div th:each="r : ${reviews}" class="review-card">
          <div class="rc-head">
            <div class="rc-av" th:text="${r.user.initial}"></div>
            <div>
              <div class="rc-author" th:text="${r.user.username}"></div>
              <div class="rc-date"   th:text="${r.formattedDate}"></div>
            </div>
          </div>
          <p class="rc-content" th:text="${r.content}"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<div th:unless="${movie != null}" style="text-align:center;padding:120px 32px;color:var(--muted)">
  <h2 style="font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:3px;margin-bottom:12px">Movie not found</h2>
  <a href="/" style="color:var(--gold)">← Back to home</a>
</div>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: navscript}"></div>

<script>
/* Navbar scroll state */
(function(){
  const nav = document.querySelector('.cineast-nav');
  if (!nav) return;
  const fn = () => window.scrollY > 40 ? nav.classList.add('scrolled') : nav.classList.remove('scrolled');
  window.addEventListener('scroll', fn, {passive:true}); fn();
})();

/* Subtle backdrop parallax on scroll */
(function(){
  const bg = document.getElementById('detailBg');
  if (!bg) return;
  window.addEventListener('scroll', () => {
    bg.style.transform = 'translateY(' + (window.scrollY * .12) + 'px)';
  }, {passive:true});
})();
</script>
</body>
</html>
