<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CINÉast — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/cineast.css">
<style>
html,body{overflow:hidden;height:100%}
#bg{position:fixed;inset:0;z-index:0}
.scene{position:relative;z-index:1;display:flex;height:100vh;align-items:center;justify-content:center;padding:24px}
.card{display:flex;width:min(900px,96vw);min-height:540px;border-radius:24px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.8),0 0 0 1px rgba(229,169,60,.12)}
.left{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 40px;gap:20px;background:linear-gradient(160deg,rgba(229,169,60,.08),rgba(13,14,18,.9));position:relative}
.left::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(229,169,60,.1),transparent 60%)}
.brand{font-family:'Bebas Neue',sans-serif;font-size:58px;letter-spacing:7px;color:#fff;position:relative;z-index:1}
.brand .e{color:var(--gold)}.brand .dot{color:var(--gold)}
.tagline{color:var(--muted);font-size:14px;text-align:center;line-height:1.8;max-width:220px;position:relative;z-index:1}
.dots{display:flex;gap:8px;position:relative;z-index:1}
.d2{width:8px;height:8px;border-radius:50%;background:rgba(229,169,60,.3);animation:p 2s infinite}
.d2:nth-child(2){animation-delay:.3s}.d2:nth-child(3){animation-delay:.6s}
@keyframes p{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
.right{flex:1;background:rgba(17,20,28,.97);display:flex;flex-direction:column;justify-content:center;padding:52px 48px}
h2{font-size:28px;font-weight:700;margin-bottom:6px}
.sub{color:var(--muted);font-size:14px;margin-bottom:32px}.sub a{color:var(--gold);text-decoration:none}
.fg{display:flex;flex-direction:column;gap:7px;margin-bottom:20px}
label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.8px;text-transform:uppercase}
.iw{position:relative}
.ii{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
input[type=text],input[type=password]{width:100%;padding:13px 16px 13px 42px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:10px;color:var(--text);font-size:15px;outline:none;transition:border-color .2s;font-family:'Inter',sans-serif}
input:focus{border-color:var(--gold);background:rgba(255,255,255,.08)}
input::placeholder{color:rgba(158,163,176,.5)}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#E5A93C,#c8891a);color:#0D0E12;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;font-family:'Inter',sans-serif;box-shadow:0 4px 20px rgba(229,169,60,.25);transition:opacity .2s,transform .15s}
.btn:hover{opacity:.92;transform:translateY(-1px)}
</style></head>
<body>
<canvas id="bg"></canvas>
<div class="scene"><div class="card">
  <div class="left">
    <div class="brand">CIN<span class="e">É</span>ast<span class="dot">.</span></div>
    <p class="tagline">Your personal cinema journal — rate, review, and discover films that matter.</p>
    <div class="dots"><div class="d2"></div><div class="d2"></div><div class="d2"></div></div>
  </div>
  <div class="right">
    <h2>Welcome back</h2>
    <p class="sub">No account? <a href="/register">Create one free</a></p>
    <div th:if="${error}" class="flash-err"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg><span th:text="${error}"></span></div>
    <div th:if="${success}" class="flash-ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;flex-shrink:0"><polyline points="20 6 9 17 4 12"/></svg><span th:text="${success}"></span></div>
    <div th:if="${message}" class="flash-ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;flex-shrink:0"><polyline points="20 6 9 17 4 12"/></svg><span th:text="${message}"></span></div>
    <form action="/login" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="fg"><label>Username</label><div class="iw"><svg class="ii" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input type="text" name="username" placeholder="Enter your username" required autocomplete="username"></div></div>
      <div class="fg"><label>Password</label><div class="iw"><svg class="ii" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" name="password" placeholder="Enter your password" required autocomplete="current-password"></div></div>
      <button type="submit" class="btn">Sign in to CINÉast</button>
    </form>
  </div>
</div></div>
<script>
const c=document.getElementById('bg'),x=c.getContext('2d');let W,H,pts=[];
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}window.addEventListener('resize',rs);rs();
for(let i=0;i<90;i++)pts.push({x:Math.random()*2000,y:Math.random()*2000,r:Math.random()*1.4+.2,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,a:Math.random()});
function draw(){x.clearRect(0,0,W,H);const g=x.createRadialGradient(W*.35,H*.3,0,W*.5,H*.5,H*.85);g.addColorStop(0,'rgba(22,18,12,1)');g.addColorStop(.5,'rgba(13,14,18,1)');g.addColorStop(1,'rgba(8,9,12,1)');x.fillStyle=g;x.fillRect(0,0,W,H);pts.forEach(p=>{p.x=(p.x+p.vx+W)%W;p.y=(p.y+p.vy+H)%H;p.a+=.005;const a=(Math.sin(p.a)*.5+.5)*.5+.04;x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fillStyle='rgba(229,169,60,'+a+')';x.fill()});requestAnimationFrame(draw)}draw();
</script>
<script>(function(){const n=document.querySelector(".cineast-nav");if(!n)return;const f=()=>window.scrollY>40?n.classList.add("scrolled"):n.classList.remove("scrolled");window.addEventListener("scroll",f,{passive:true});f();})();</script>
</body></html>
