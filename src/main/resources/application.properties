# ── Server ────────────────────────────────────────────────────────────────────
server.port=8083

# ── Database ───────────────────────────────────────────────────────────────────
# UPDATE THESE TWO LINES with your MySQL password
spring.datasource.url=jdbc:mysql://localhost:3307/cineast?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
# update = auto-creates/updates tables on startup (no need to run schema.sql manually)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Thymeleaf ──────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── TMDb API ───────────────────────────────────────────────────────────────────
tmdb.api.key=258a95ca5535c2d4861066d14589a2d5
tmdb.base.url=https://api.themoviedb.org/3